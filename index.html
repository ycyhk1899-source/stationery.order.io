<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文具下單系統</title>
<style>
:root {
  --bg: #0f1117;
  --card: #1a1d27;
  --border: #2a2e3a;
  --text: #e8eaed;
  --muted: #9aa0a6;
  --accent: #4f8cff;
  --accent2: #00c853;
  --warning: #ffb300;
  --danger: #ff5252;
  --radius: 12px;
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Microsoft JhengHei", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.5;
}
header {
  background: linear-gradient(135deg, #1a1d27, #252836);
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
}
h1 { margin: 0; font-size: 1.3rem; font-weight: 700; }
h1 span { color: var(--accent); }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tabs button {
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 0.9rem;
}
.tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.login-info { font-size: 0.85rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }
main { max-width: 1320px; margin: 0 auto; padding: 20px; }
.section { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }

/* Two-column Order Layout */
.order-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  gap: 20px;
  align-items: start;
}
.order-main-col { min-width: 0; }
.order-side-col {
  position: sticky;
  top: 82px;
}
.side-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}
.side-card h3 {
  margin: 0 0 12px;
  font-size: 1.05rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.side-summary-list {
  max-height: 48vh;
  overflow-y: auto;
  padding-right: 4px;
  margin-bottom: 14px;
}
.side-empty {
  color: var(--muted);
  font-size: 0.9rem;
  text-align: center;
  padding: 28px 10px;
  background: #12141c;
  border: 1px dashed var(--border);
  border-radius: 10px;
  margin-bottom: 14px;
}

.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 12px; }
label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
input, select, textarea {
  width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: #12141c; color: var(--text); font-size: 1rem;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.filters button {
  background: #252836; border: 1px solid var(--border); color: var(--text);
  padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.85rem;
}
.filters button.active { background: var(--accent); border-color: var(--accent); }
.search-box { margin-bottom: 16px; }
.item-list { display: flex; flex-direction: column; gap: 10px; }
.item {
  display: grid; grid-template-columns: 1fr auto auto auto; gap: 12px; align-items: center;
  padding: 12px; background: #12141c; border-radius: 10px; border: 1px solid var(--border);
}
.item-info { min-width: 0; display: flex; align-items: center; gap: 12px; }
.item-thumb {
  width: 52px; height: 52px; object-fit: cover; border-radius: 8px;
  border: 1px solid var(--border); background: #1e2230; flex-shrink: 0;
}
.item-thumb-placeholder {
  width: 52px; height: 52px; border-radius: 8px; border: 1px dashed var(--border);
  background: #181b25; color: var(--muted); font-size: 0.7rem;
  display: flex; align-items: center; justify-content: center; text-align: center; flex-shrink: 0;
}
.item-text { min-width: 0; }
.item-name { font-weight: 600; word-break: break-word; }
.item-name a { color: var(--accent); text-decoration: none; }
.item-name a:hover { text-decoration: underline; }
.item-meta { font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
.item-link {
  color: var(--accent); text-decoration: none; font-size: 0.78rem;
  background: #4f8cff1a; padding: 2px 8px; border-radius: 10px; border: 1px solid #4f8cff44;
}
.item-link:hover { background: #4f8cff33; }
.qty-control { display: flex; align-items: center; gap: 6px; }
.qty-control button {
  width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
  background: #252836; color: var(--text); cursor: pointer; font-size: 1.1rem;
}
.qty-control input { width: 60px; text-align: center; padding: 6px; }
.unit { color: var(--muted); font-size: 0.85rem; min-width: 48px; text-align: right; }
.item-actions { display: flex; align-items: center; gap: 6px; }
.icon-btn {
  background: #252836; border: 1px solid var(--border); color: var(--muted);
  padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 0.8rem;
}
.icon-btn:hover { color: var(--text); border-color: var(--accent); }
.icon-btn.del:hover { color: #fff; background: var(--danger); border-color: var(--danger); }

.summary-item {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 8px 10px; font-size: 0.9rem; background: #12141c;
  border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px;
}
.summary-item-name { flex: 1; min-width: 0; word-break: break-word; }
.summary-item-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; color: var(--accent); font-weight: 600; }
.summary-remove {
  background: transparent; border: none; color: var(--muted); cursor: pointer;
  font-size: 1rem; padding: 0 4px; line-height: 1;
}
.summary-remove:hover { color: var(--danger); }

.btn {
  background: var(--accent); color: #fff; border: none; padding: 12px 24px;
  border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%;
}
.btn:hover { opacity: 0.9; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.secondary { background: #252836; border: 1px solid var(--border); }
.btn.success { background: var(--accent2); color: #000; }
.btn.warning { background: var(--warning); color: #000; }
.btn.danger { background: var(--danger); }
.month-group { margin-bottom: 24px; }
.month-title {
  font-size: 1.1rem; font-weight: 700; margin: 0 0 12px;
  padding-bottom: 8px; border-bottom: 2px solid var(--accent);
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
}
.month-title .count { font-size: 0.85rem; color: var(--muted); font-weight: normal; }
.order-card {
  background: #12141c; border: 1px solid var(--border); border-radius: 10px;
  padding: 16px; margin-bottom: 12px; position: relative;
}
.order-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
.badge { padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
.badge.pending { background: #ffb30033; color: #ffb300; }
.badge.ordered { background: #4f8cff33; color: #4f8cff; }
.badge.arrived { background: #00c85333; color: #00c853; }
.badge.cancelled { background: #ff525233; color: #ff5252; }
.empty { text-align: center; color: var(--muted); padding: 40px; }
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--accent2); color: #000; padding: 12px 24px; border-radius: 10px;
  font-weight: 600; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;
}
.toast.show { opacity: 1; }
.status-select { width: auto; padding: 4px 8px; font-size: 0.85rem; }
.filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.checkbox-label { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; cursor: pointer; }
.bulk-bar {
  background: #252836; border: 1px solid var(--border); border-radius: 10px;
  padding: 12px; margin-bottom: 16px; display: none; align-items: center; gap: 10px; flex-wrap: wrap;
}
.bulk-bar.show { display: flex; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat-card {
  background: #12141c; border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center;
}
.stat-card .num { font-size: 1.8rem; font-weight: 700; }
.stat-card .label { font-size: 0.85rem; color: var(--muted); }
.login-modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 200;
}
.login-modal.show { display: flex; }
.login-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 90%; max-width: 420px; }
.add-item-form { display: none; background: #1e2230; border-radius: 10px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); }
.add-item-form.show { display: block; }
.sync-status { font-size: 0.8rem; padding: 3px 10px; border-radius: 12px; background: #252836; color: var(--muted); }
.sync-status.ok { color: var(--accent2); }
.sync-status.err { color: var(--danger); }

@media (max-width: 900px) {
  .order-layout {
    grid-template-columns: 1fr;
  }
  .order-side-col {
    position: static;
  }
  .side-summary-list {
    max-height: none;
  }
}
@media (max-width: 600px) {
  .item { grid-template-columns: 1fr; }
  .qty-control { justify-content: flex-end; }
  .item-actions { justify-content: flex-end; }
  .order-header { flex-direction: column; }
}
</style>
</head>
<body>
<header>
  <h1>文具<span>下單</span>系統</h1>
  <div class="tabs">
    <button class="active" data-tab="order">下單</button>
    <button data-tab="records">下單紀錄</button>
    <button data-tab="status">狀態查詢</button>
  </div>
  <div class="login-info" id="loginInfo">
    <span class="sync-status" id="syncStatus">同步中...</span>
    <span id="loginStatus">未登入</span>
    <button class="btn secondary" id="loginBtn" style="width:auto; padding:6px 12px; font-size:0.85rem">登入</button>
  </div>
</header>

<main>
  <!-- Order Tab -->
  <div id="tab-order">
    <div class="order-layout">
      <!-- Left Main Column -->
      <div class="order-main-col">
        <div class="section">
          <h2 style="margin-top:0">下單資料</h2>
          <div class="form-row">
            <div>
              <label>下單人姓名</label>
              <input type="text" id="requester" placeholder="請輸入姓名">
            </div>
            <div>
              <label>客戶</label>
              <select id="department">
                <option value="">請選擇</option>
                <option>Office</option>
                <option>Apple</option>
                <option>Go Pro</option>
                <option>Sennheiser</option>
                <option>Sonova</option>
                <option>Balluff</option>
                <option>Lululemon</option>
                <option>其他</option>
              </select>
            </div>
            <div>
              <label>下單日期</label>
              <input type="date" id="orderDate">
            </div>
            <div>
              <label>聯絡電話 / Email（選填）</label>
              <input type="text" id="contact" placeholder="可選">
            </div>
          </div>
          <div>
            <label>備註</label>
            <textarea id="notes" rows="2" placeholder="特殊要求或備註..."></textarea>
          </div>
        </div>

        <div class="section">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:10px; flex-wrap:wrap;">
            <div class="search-box" style="flex:1; margin:0; min-width:200px;">
              <input type="text" id="search" placeholder="搜尋文具名稱...">
            </div>
            <button class="btn secondary" id="toggleAddItem" style="width:auto; padding:10px 16px;">＋ 新增文具</button>
          </div>

          <div class="add-item-form" id="addItemForm">
            <h3 style="margin-top:0">新增文具項目</h3>
            <div class="form-row">
              <div>
                <label>分類</label>
                <select id="newCat"></select>
              </div>
              <div id="newCatCustomWrap" style="display:none">
                <label>新分類名稱</label>
                <input type="text" id="newCatCustom" placeholder="請輸入新分類名稱">
              </div>
              <div>
                <label>名稱</label>
                <input type="text" id="newName" placeholder="文具名稱">
              </div>
              <div>
                <label>單位</label>
                <input type="text" id="newUnit" placeholder="例如：Box、Piece">
              </div>
            </div>
            <div class="form-row">
              <div>
                <label>產品連結（選填，預設為 Garret 產品頁）</label>
                <input type="url" id="newLink" placeholder="https://www.garret.com.hk/product.php...">
              </div>
              <div>
                <label>圖片網址（選填，可貼上 Garret 圖片連結）</label>
                <input type="url" id="newImageUrl" placeholder="https://www.garret.com.hk/...">
              </div>
            </div>
            <div style="margin:12px 0">
              <label>或上傳本地商品圖片（若未填圖片網址則必填）</label>
              <input type="file" id="newImage" accept="image/*">
              <div id="imagePreview" style="margin-top:8px"></div>
            </div>
            <button class="btn" id="saveNewItem" style="margin-top:8px;">儲存新項目</button>
          </div>

          <div class="filters" id="categoryFilters"></div>
          <div class="item-list" id="itemList"></div>
        </div>
      </div>

      <!-- Right Sticky Column: Selected Items & Submit -->
      <aside class="order-side-col">
        <div class="side-card">
          <h3>
            <span>已選項目 (<span id="selectedCount">0</span>)</span>
            <button class="btn secondary" id="clearCartBtn" style="width:auto; padding:4px 10px; font-size:0.8rem; display:none;">清空已選</button>
          </h3>
          <div id="sideEmpty" class="side-empty">尚未選擇任何文具項目<br>請在左側調整數量</div>
          <div class="side-summary-list" id="summaryItems" style="display:none"></div>
          <button class="btn" id="submitBtn">提交下單</button>
        </div>
      </aside>
    </div>
  </div>

  <!-- Records Tab -->
  <div id="tab-records" style="display:none">
    <div class="section">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
        <h2 style="margin:0">所有下單紀錄</h2>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn secondary" id="refreshRecordsBtn" style="width:auto; padding:10px 16px">重新整理雲端資料</button>
          <button class="btn secondary" id="exportBtn" style="width:auto; padding:10px 16px">匯出明細 CSV</button>
          <button class="btn secondary" id="exportMonthBtn" style="width:auto; padding:10px 16px">匯出月份總計</button>
          <button class="btn secondary" id="exportBackupBtn" style="width:auto; padding:10px 16px">匯出完整備份</button>
          <button class="btn danger" id="clearBtn" style="width:auto; padding:10px 16px; display:none">清空所有紀錄</button>
        </div>
      </div>
      <div class="filter-bar">
        <select id="monthFilter" style="width:auto">
          <option value="all">全部月份</option>
        </select>
        <select id="deptFilter" style="width:auto">
          <option value="all">全部客戶</option>
          <option>Office</option>
          <option>Apple</option>
          <option>Go Pro</option>
          <option>Sennheiser</option>
          <option>Sonova</option>
          <option>Balluff</option>
          <option>Lululemon</option>
          <option>其他</option>
        </select>
        <select id="statusFilter" style="width:auto">
          <option value="all">全部狀態</option>
          <option value="待下單">待下單</option>
          <option value="已下單">已下單</option>
          <option value="已到貨">已到貨</option>
          <option value="已取消">已取消</option>
        </select>
      </div>

      <div class="bulk-bar" id="bulkBar">
        <span id="selectedCountText">已選 0 筆</span>
        <select id="bulkStatus" style="width:auto">
          <option value="">選擇新狀態...</option>
          <option>待下單</option>
          <option>已下單</option>
          <option>已到貨</option>
          <option>已取消</option>
        </select>
        <button class="btn secondary" id="bulkUpdateBtn" style="width:auto; padding:8px 16px">更新選取</button>
      </div>

      <div id="recordsList"></div>
    </div>
  </div>

  <!-- Status Query Tab -->
  <div id="tab-status" style="display:none">
    <div class="section">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
        <h2 style="margin:0">狀態查詢</h2>
        <button class="btn secondary" id="refreshStatusBtn" style="width:auto; padding:10px 16px">重新整理雲端資料</button>
      </div>
      <div class="stat-grid" id="statGrid"></div>
      <div class="filter-bar">
        <select id="statusQueryFilter" style="width:auto">
          <option value="all">全部狀態</option>
          <option value="待下單">待下單</option>
          <option value="已下單">已下單</option>
          <option value="已到貨">已到貨</option>
          <option value="已取消">已取消</option>
        </select>
        <select id="statusDeptFilter" style="width:auto">
          <option value="all">全部部門</option>
          <option>Office</option>
          <option>Apple</option>
          <option>Go Pro</option>
          <option>Sennheiser</option>
          <option>Sonova</option>
          <option>Balluff</option>
          <option>Lululemon</option>
          <option>其他</option>
        </select>
        <select id="statusMonthFilter" style="width:auto">
          <option value="all">全部月份</option>
        </select>
      </div>
      <div id="statusList"></div>
    </div>
  </div>
</main>

<!-- Login Modal -->
<div class="login-modal" id="loginModal">
  <div class="login-box">
    <h3 style="margin-top:0">管理員登入</h3>
    <p style="color:var(--muted);font-size:0.9rem">登入後可更改狀態、刪除紀錄</p>
    <div style="margin:16px 0">
      <label>帳號</label>
      <input type="text" id="loginUser" placeholder="admin" value="admin">
    </div>
    <div style="margin-bottom:16px">
      <label>密碼</label>
      <input type="password" id="loginPass" placeholder="請輸入密碼">
    </div>
    <div style="display:flex; gap:8px">
      <button class="btn" id="doLoginBtn">登入</button>
      <button class="btn secondary" id="cancelLoginBtn">取消</button>
    </div>
  </div>
</div>

<!-- Edit Item Media/Link Modal -->
<div class="login-modal" id="editItemModal">
  <div class="login-box">
    <h3 style="margin-top:0">設定文具圖片與連結</h3>
    <p id="editItemTitle" style="color:var(--accent);font-weight:600;margin-bottom:12px;"></p>
    <input type="hidden" id="editItemId">
    <div style="margin-bottom:12px">
      <label>產品網頁連結（預設為 Garret 產品目錄）</label>
      <input type="url" id="editItemLink" placeholder="https://www.garret.com.hk/product.php">
    </div>
    <div style="margin-bottom:12px">
      <label>圖片網址（可從 Garret 網站右鍵「複製圖片位址」貼上）</label>
      <input type="url" id="editItemImageUrl" placeholder="https://www.garret.com.hk/...">
    </div>
    <div style="margin-bottom:16px">
      <label>或上傳本地圖片覆蓋</label>
      <input type="file" id="editItemImageFile" accept="image/*">
      <div id="editItemPreview" style="margin-top:8px"></div>
    </div>
    <div style="display:flex; gap:8px">
      <button class="btn" id="saveEditItemBtn">儲存設定</button>
      <button class="btn secondary" id="cancelEditItemBtn">取消</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// 請將下方網址替換為你的 Google Apps Script 部署網址（結尾為 /exec）
const GAS_URL = 'https://script.google.com/macros/s/AKfycbykGtLyn0txJpqDPybn_BdJzL5-U_lMM8GD3Adbv6KWRbg5Ka5hKI8WeLdcNaXirg60hQ/exec';
const GARRET_CATALOG_URL = 'https://www.garret.com.hk/product.php';

const DEFAULT_ITEMS = [
  {"id":1,"category":"筆","name":"天鵝牌藍原子筆(10)","unit":"Box"},
  {"id":2,"category":"筆","name":"天鵝牌黑原子筆(10)","unit":"Box"},
  {"id":3,"category":"筆","name":"天鵝牌紅原子筆(10)","unit":"Box"},
  {"id":4,"category":"筆","name":"天鵝牌按掣原子筆(藍)","unit":"Box"},

function loadHiddenItemIds() {

function setSyncBadge(text, state) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  el.textContent = text;
  el.className = 'sync-status' + (state ? ' ' + state : '');
}

function isGasConfigured() {
  return GAS_URL && !GAS_URL.includes('請貼上你的部署ID');
}

async function syncFromCloud(showToast = false) {
  if (!isGasConfigured()) {
    setSyncBadge('尚未設定雲端網址', 'err');
    return;
  }
  setSyncBadge('同步中...', '');
  try {
    const res = await fetch(GAS_URL, { method: 'GET', cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    cachedOrders = Array.isArray(data.orders) ? data.orders : [];
    cachedCustomItems = Array.isArray(data.customItems) ? data.customItems : [];
    setSyncBadge('雲端已同步', 'ok');
    if (showToast) toast('已從 Google Sheets 更新最新資料');
  } catch (err) {
    console.error('Sync from cloud failed:', err);
    setSyncBadge('雲端連線失敗', 'err');
    if (showToast) toast('讀取雲端資料失敗，請檢查 GAS_URL 設定');
  }
}

async function apiPost(payload) {
  if (!isGasConfigured()) {
    throw new Error('尚未設定 GAS_URL');
  }
  setSyncBadge('儲存中...', '');
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const result = await res.json();
  if (result && result.ok === false) {
    throw new Error(result.error || '雲端寫入失敗');
  }
  setSyncBadge('雲端已同步', 'ok');
  return result;
}

function loadCustomItems() {

function saveCustomItems(items) {

}
function getAllItems() {
  const hiddenSet = new Set(loadHiddenItemIds().map(Number));
  const overrides = loadItemOverrides();
  const base = DEFAULT_ITEMS.map(item => {
    const ov = overrides[item.id] || {};
    return {
      ...item,
      image: ov.image !== undefined ? ov.image : (item.image || ''),
      link: ov.link !== undefined ? ov.link : (item.link || GARRET_CATALOG_URL)
    };
  });
  const custom = loadCustomItems().map(item => {
    const ov = overrides[item.id] || {};
    return {
      ...item,
      image: ov.image !== undefined ? ov.image : (item.image || ''),
      link: ov.link !== undefined ? ov.link : (item.link || GARRET_CATALOG_URL)
    };
  });
  return [...base, ...custom].filter(item => !hiddenSet.has(Number(item.id)));
}

  return cachedOrders;
}

function getMonthKey(dateStr) {
  if (!dateStr) return '未知月份';
  return dateStr.slice(0, 7);
}

function renderCategories() {
  allItems = getAllItems();
  const cats = [...new Set(allItems.map(i => i.category))];
  if (currentCategory !== '全部' && !cats.includes(currentCategory)) {
    currentCategory = '全部';
  }
  const el = document.getElementById('categoryFilters');
  el.innerHTML = `<button class="${currentCategory==='全部'?'active':''}" data-cat="全部">全部</button>` +
    cats.map(c => `<button class="${currentCategory===c?'active':''}" data-cat="${c}">${c}</button>`).join('');
  el.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => { currentCategory = btn.dataset.cat; renderCategories(); renderItems(); };
  });
  updateCategorySelectOptions();
}

function escapeHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderItems() {
  allItems = getAllItems();
  const filtered = allItems.filter(item => {
    const catOk = currentCategory === '全部' || item.category === currentCategory;
    const searchOk = !searchTerm || item.name.toLowerCase().includes(searchTerm.toLowerCase());
    return catOk && searchOk;
  });

  document.getElementById('itemList').innerHTML = filtered.map(item => {
    const itemLink = item.link || GARRET_CATALOG_URL;
    const thumbHtml = item.image
      ? `<a href="${escapeHtml(itemLink)}" target="_blank" rel="noopener noreferrer" title="查看產品頁"><img src="${escapeHtml(item.image)}" class="item-thumb" alt="${escapeHtml(item.name)}" onerror="this.style.display='none'"></a>`
      : `<a href="${escapeHtml(itemLink)}" target="_blank" rel="noopener noreferrer" class="item-thumb-placeholder" title="前往 Garret 查看圖片">尚無<br>圖片</a>`;

    return `
      <div class="item" data-id="${item.id}">
        <div class="item-info">
          ${thumbHtml}
          <div class="item-text">
            <div class="item-name">
              <a href="${escapeHtml(itemLink)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.name)}</a>
            </div>
            <div class="item-meta">
              <span>${escapeHtml(item.category)} · ${escapeHtml(item.unit)}</span>
              <a href="${escapeHtml(itemLink)}" target="_blank" rel="noopener noreferrer" class="item-link">Garret 參考 ↗</a>
            </div>
          </div>
        </div>
        <div class="qty-control">
          <button data-action="minus" data-id="${item.id}">−</button>
          <input type="number" min="0" value="${quantities[item.id]||0}" data-id="${item.id}" class="qty-input">
          <button data-action="plus" data-id="${item.id}">+</button>
        </div>
        <div class="unit">${escapeHtml(item.unit)}</div>
        <div class="item-actions">
          <button class="icon-btn" data-edit-item="${item.id}" title="設定圖片與連結">圖/連</button>
          <button class="icon-btn del" data-del-item="${item.id}" title="刪除此文具項目">刪除</button>
        </div>
      </div>
    `;
  }).join('') || '<div class="empty">沒有符合的項目</div>';

  document.querySelectorAll('.qty-input').forEach(input => {
    input.onchange = input.oninput = e => {
      const id = +e.target.dataset.id;
      quantities[id] = Math.max(0, parseInt(e.target.value) || 0);
      updateSummary();
    };
  });
  document.querySelectorAll('[data-action]').forEach(btn => {
    btn.onclick = () => {
      const id = +btn.dataset.id;
      const delta = btn.dataset.action === 'plus' ? 1 : -1;
      quantities[id] = Math.max(0, (quantities[id] || 0) + delta);
      const input = document.querySelector(`.qty-input[data-id="${id}"]`);
      if (input) input.value = quantities[id];
      updateSummary();
    };
  });
  document.querySelectorAll('[data-edit-item]').forEach(btn => {
    btn.onclick = () => openEditItemModal(+btn.dataset.editItem);
  });
  document.querySelectorAll('[data-del-item]').forEach(btn => {
    btn.onclick = () => deleteStationeryItem(+btn.dataset.delItem);
  });
}

async function deleteStationeryItem(id) {
  const item = getAllItems().find(i => Number(i.id) === Number(id));
  if (!item) return;
  if (!confirm(`確定要刪除文具項目「${item.name}」嗎？`)) return;

  const isCustom = cachedCustomItems.some(c => Number(c.id) === Number(id));
  if (isCustom) {
    if (isGasConfigured()) {
      try {
        await apiPost({ action: 'deleteCustomItem', id });
      } catch (e) {
        console.warn('Cloud deleteCustomItem failed, hiding locally as well:', e);
      }
    }
    cachedCustomItems = cachedCustomItems.filter(c => Number(c.id) !== Number(id));
  }

  const hidden = loadHiddenItemIds();
  if (!hidden.includes(Number(id))) {
    hidden.push(Number(id));
    saveHiddenItemIds(hidden);
  }

  delete quantities[id];
  renderCategories();
  renderItems();
  updateSummary();
  toast(`已刪除文具「${item.name}」`);
}

function openEditItemModal(id) {
  const item = getAllItems().find(i => Number(i.id) === Number(id));
  if (!item) return;
  document.getElementById('editItemId').value = item.id;
  document.getElementById('editItemTitle').textContent = item.name;
  document.getElementById('editItemLink').value = item.link || GARRET_CATALOG_URL;
  document.getElementById('editItemImageUrl').value = (item.image && !item.image.startsWith('data:')) ? item.image : '';
  document.getElementById('editItemImageFile').value = '';
  document.getElementById('editItemPreview').innerHTML = item.image
    ? `<img src="${escapeHtml(item.image)}" style="max-width:120px;max-height:120px;border-radius:8px">`
    : '';
  document.getElementById('editItemModal').classList.add('show');
}

document.getElementById('editItemImageFile').onchange = async e => {
  const file = e.target.files[0];
  const preview = document.getElementById('editItemPreview');
  if (file) {
    try {
      const compressed = await compressImageDataUrl(file);
      preview.innerHTML = `<img src="${compressed}" style="max-width:120px;max-height:120px;border-radius:8px">`;
    } catch {
      preview.innerHTML = '';
    }
  }

document.getElementById('saveEditItemBtn').onclick = async () => {
  const id = +document.getElementById('editItemId').value;
  const link = document.getElementById('editItemLink').value.trim() || GARRET_CATALOG_URL;
  const imgUrl = document.getElementById('editItemImageUrl').value.trim();
  const file = document.getElementById('editItemImageFile').files[0];

  const item = getAllItems().find(i => Number(i.id) === Number(id));
  if (!item) return;

  let finalImage = item.image || '';
  if (file) {
    finalImage = await compressImageDataUrl(file);
  } else if (imgUrl) {
    finalImage = imgUrl;
  }

  const overrides = loadItemOverrides();
  overrides[id] = { link, image: finalImage };
  saveItemOverrides(overrides);

  // If custom item and GAS configured, sync update
  const customIdx = cachedCustomItems.findIndex(c => Number(c.id) === Number(id));
  if (customIdx !== -1) {
    cachedCustomItems[customIdx] = { ...cachedCustomItems[customIdx], link, image: finalImage };
    if (isGasConfigured()) {
      try {
        await apiPost({ action: 'updateCustomItem', item: cachedCustomItems[customIdx] });
      } catch (e) {
        console.warn('Cloud updateCustomItem failed:', e);
      }
    }
  }

  document.getElementById('editItemModal').classList.remove('show');
  renderItems();
  toast('已更新文具圖片與連結');
};

document.getElementById('cancelEditItemBtn').onclick = () => {
  document.getElementById('editItemModal').classList.remove('show');
};

function updateSummary() {
  allItems = getAllItems();
  const selected = allItems.filter(i => quantities[i.id] > 0);
  const countEl = document.getElementById('selectedCount');
  const itemsEl = document.getElementById('summaryItems');
  const emptyEl = document.getElementById('sideEmpty');
  const clearCartBtn = document.getElementById('clearCartBtn');

  countEl.textContent = selected.length;

  if (selected.length === 0) {
    emptyEl.style.display = 'block';
    itemsEl.style.display = 'none';
    clearCartBtn.style.display = 'none';
    return;
  }

  emptyEl.style.display = 'none';
  itemsEl.style.display = 'block';
  clearCartBtn.style.display = 'inline-block';

  itemsEl.innerHTML = selected.map(i => `
    <div class="summary-item">
      <span class="summary-item-name">${escapeHtml(i.name)}</span>
      <span class="summary-item-right">
        <span>${quantities[i.id]} ${escapeHtml(i.unit)}</span>
        <button class="summary-remove" data-remove-cart="${i.id}" title="移除此項">✕</button>
      </span>
    </div>
  `).join('');

  itemsEl.querySelectorAll('[data-remove-cart]').forEach(btn => {
    btn.onclick = () => {
      const id = +btn.dataset.removeCart;
      quantities[id] = 0;
      const input = document.querySelector(`.qty-input[data-id="${id}"]`);
      if (input) input.value = 0;
      updateSummary();
    };
  });
}

document.getElementById('clearCartBtn').onclick = () => {
  quantities = {};
  renderItems();
  updateSummary();
};

async function switchTab(tab) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('tab-order').style.display = tab === 'order' ? 'block' : 'none';
  document.getElementById('tab-records').style.display = tab === 'records' ? 'block' : 'none';
  document.getElementById('tab-status').style.display = tab === 'status' ? 'block' : 'none';
  if (tab === 'records') {
    await syncFromCloud(false);
    renderRecords();
  }
  if (tab === 'status') {
    await syncFromCloud(false);
    renderStatusQuery();
  }
}

function getStatusClass(status) {
  if (status === '待下單') return 'pending';
  if (status === '已下單') return 'ordered';
  if (status === '已到貨') return 'arrived';
  if (status === '已取消') return 'cancelled';
  return '';
}

function updateMonthFilterOptions() {
  const orders = loadOrders();
  const months = [...new Set(orders.map(o => getMonthKey(o.orderDate || new Date(o.timestamp).toISOString().slice(0,10))))].sort().reverse();
  const sel = document.getElementById('monthFilter');
  const current = sel.value;
  sel.innerHTML = '<option value="all">全部月份</option>' + months.map(m => `<option value="${m}">${m}</option>`).join('');
  sel.value = months.includes(current) ? current : 'all';

  const sel2 = document.getElementById('statusMonthFilter');
  const current2 = sel2.value;
  sel2.innerHTML = '<option value="all">全部月份</option>' + months.map(m => `<option value="${m}">${m}</option>`).join('');
  sel2.value = months.includes(current2) ? current2 : 'all';
}

function updateBulkBar() {
  const bar = document.getElementById('bulkBar');
  const text = document.getElementById('selectedCountText');
  text.textContent = `已選 ${selectedIds.size} 筆`;
  bar.classList.toggle('show', selectedIds.size > 0 && isLoggedIn);
}

function renderRecords() {
  updateMonthFilterOptions();
  let orders = loadOrders();

  if (monthFilter !== 'all') {
    orders = orders.filter(o => getMonthKey(o.orderDate || new Date(o.timestamp).toISOString().slice(0,10)) === monthFilter);
  }
  if (deptFilter !== 'all') {
    orders = orders.filter(o => (o.department || '') === deptFilter);
  }
  if (statusFilter !== 'all') {
    orders = orders.filter(o => (o.status || '待下單') === statusFilter);
  }

  orders.sort((a, b) => {
    const da = a.orderDate || new Date(a.timestamp).toISOString().slice(0,10);
    const db = b.orderDate || new Date(b.timestamp).toISOString().slice(0,10);
    return db.localeCompare(da);
  });

  const el = document.getElementById('recordsList');
  if (orders.length === 0) {
    el.innerHTML = '<div class="empty">暫無下單紀錄</div>';
    updateBulkBar();
    return;
  }

  const groups = {};
  orders.forEach(o => {
    const key = getMonthKey(o.orderDate || new Date(o.timestamp).toISOString().slice(0,10));
    if (!groups[key]) groups[key] = [];
    groups[key].push(o);
  });

  const sortedMonths = Object.keys(groups).sort().reverse();

  el.innerHTML = sortedMonths.map(month => {
    const list = groups[month];
    return `
      <div class="month-group">
        <div class="month-title">
          <span>${month} <span class="count">(${list.length} 筆)</span></span>
          ${isLoggedIn ? `<button class="btn secondary" style="width:auto; padding:6px 12px; font-size:0.85rem" data-select-month="${month}">全選此月</button>` : ''}
        </div>
        ${list.map(o => {
          const status = o.status || '待下單';
          const date = o.orderDate || new Date(o.timestamp).toISOString().slice(0,10);
          const checked = selectedIds.has(o.id) ? 'checked' : '';
          return `
            <div class="order-card" data-id="${o.id}">
              <div class="order-header">
                <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap">
                  ${isLoggedIn ? `<label class="checkbox-label"><input type="checkbox" class="order-check" data-id="${o.id}" ${checked}> 選取</label>` : ''}
                  <strong>${escapeHtml(o.requester || '未填姓名')}</strong>
                  <span class="badge">${escapeHtml(o.department || '未選部門')}</span>
                  <span class="badge ${getStatusClass(status)}">${escapeHtml(status)}</span>
                </div>
                <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                  <span style="color:var(--muted);font-size:0.85rem">${date}</span>
                  ${isLoggedIn ? `
                    <select class="status-select" data-id="${o.id}">
                      ${STATUSES.map(s => `<option value="${s}" ${s===status?'selected':''}>${s}</option>`).join('')}
                    </select>
                  ` : `<span style="font-size:0.85rem;color:var(--muted)">（登入後可改狀態）</span>`}
                </div>
              </div>
              ${o.contact ? `<div style="font-size:0.85rem;color:var(--muted)">聯絡：${escapeHtml(o.contact)}</div>` : ''}
              ${o.notes ? `<div style="font-size:0.85rem;margin:6px 0">備註：${escapeHtml(o.notes)}</div>` : ''}
              <div style="margin-top:8px">
                ${o.items.map(it => `<div style="font-size:0.9rem">${escapeHtml(it.name)} × ${it.qty} ${escapeHtml(it.unit)}</div>`).join('')}
              </div>
              ${isLoggedIn ? `<button class="btn secondary" style="margin-top:10px;width:auto;padding:6px 12px;font-size:0.85rem" data-del="${o.id}">刪除這筆</button>` : '<div style="margin-top:8px;font-size:0.8rem;color:var(--muted)">登入後可刪除</div>'}
            </div>
          `;
        }).join('')}
      </div>
    `;
  }).join('');

  if (isLoggedIn) {
    document.querySelectorAll('.order-check').forEach(cb => {
      cb.onchange = () => {
        const id = +cb.dataset.id;
        if (cb.checked) selectedIds.add(id);
        else selectedIds.delete(id);
        updateBulkBar();
      };
    });

    document.querySelectorAll('[data-select-month]').forEach(btn => {
      btn.onclick = () => {
        const month = btn.dataset.selectMonth;
        const monthOrders = groups[month] || [];
        monthOrders.forEach(o => selectedIds.add(o.id));
        renderRecords();
        updateBulkBar();
      };
    });

    document.querySelectorAll('.status-select').forEach(sel => {
      sel.onchange = async () => {
        if (!isLoggedIn) return toast('請先登入');
        const id = +sel.dataset.id;
        const orders = loadOrders();
        const order = orders.find(o => o.id === id);
        if (order) {
          const oldStatus = order.status;
          order.status = sel.value;
          sel.disabled = true;
          try {
            await apiPost({ action: 'updateOrder', order });
            saveOrders(orders);
            toast('狀態已同步更新');
            renderRecords();
          } catch (e) {
            order.status = oldStatus;
            sel.disabled = false;
            setSyncBadge('雲端連線失敗', 'err');
            toast('更新失敗，請檢查網路');
          }
        }
      };
    });

    document.querySelectorAll('[data-del]').forEach(btn => {
      btn.onclick = async () => {
        if (!isLoggedIn) return toast('請先登入');
        if (!confirm('確定刪除這筆紀錄？')) return;
        const id = +btn.dataset.del;
        btn.disabled = true;
        try {
          await apiPost({ action: 'deleteOrder', id });
          const orders = loadOrders().filter(o => o.id !== id);
          saveOrders(orders);
          selectedIds.delete(id);
          renderRecords();
          toast('已從雲端刪除');
        } catch (e) {
          btn.disabled = false;
          setSyncBadge('雲端連線失敗', 'err');
          toast('刪除失敗，請檢查網路');
        }
      };
    });
  }

  updateBulkBar();
}

function renderStatusQuery() {
  updateMonthFilterOptions();
  let orders = loadOrders();

  if (statusMonthFilter !== 'all') {
    orders = orders.filter(o => getMonthKey(o.orderDate || new Date(o.timestamp).toISOString().slice(0,10)) === statusMonthFilter);
  }
  if (statusDeptFilter !== 'all') {
    orders = orders.filter(o => (o.department || '') === statusDeptFilter);
  }
  if (statusQueryFilter !== 'all') {
    orders = orders.filter(o => (o.status || '待下單') === statusQueryFilter);
  }

  const all = loadOrders();
  const stats = {
    '待下單': all.filter(o => (o.status || '待下單') === '待下單').length,
    '已下單': all.filter(o => o.status === '已下單').length,
    '已到貨': all.filter(o => o.status === '已到貨').length,
    '已取消': all.filter(o => o.status === '已取消').length
  };

  document.getElementById('statGrid').innerHTML = Object.entries(stats).map(([s, n]) => `
    <div class="stat-card">
      <div class="num">${n}</div>
      <div class="label">${s}</div>
    </div>
  `).join('');

  const el = document.getElementById('statusList');
  if (orders.length === 0) {
    el.innerHTML = '<div class="empty">沒有符合條件的紀錄</div>';
    return;
  }

  orders.sort((a, b) => {
    const da = a.orderDate || new Date(a.timestamp).toISOString().slice(0,10);
    const db = b.orderDate || new Date(b.timestamp).toISOString().slice(0,10);
    return db.localeCompare(da);
  });

  el.innerHTML = orders.map(o => {
    const status = o.status || '待下單';
    const date = o.orderDate || new Date(o.timestamp).toISOString().slice(0,10);
    return `
      <div class="order-card">
        <div class="order-header">
          <div>
            <strong>${escapeHtml(o.requester || '未填姓名')}</strong>
            <span class="badge">${escapeHtml(o.department || '未選部門')}</span>
            <span class="badge ${getStatusClass(status)}">${escapeHtml(status)}</span>
          </div>
          <span style="color:var(--muted);font-size:0.85rem">${date}</span>
        </div>
        <div style="font-size:0.9rem;margin-top:6px">
          ${o.items.map(it => `${escapeHtml(it.name)} × ${it.qty} ${escapeHtml(it.unit)}`).join('　')}
        </div>
      </div>
    `;
  }).join('');
}

// Bulk update (login required)
document.getElementById('bulkUpdateBtn').onclick = async () => {
  if (!isLoggedIn) return toast('請先登入');

    });

document.getElementById('exportMonthBtn').onclick = () => {
  const month = monthFilter === 'all' ? prompt('請輸入要匯出的月份（格式：2026-10）') : monthFilter;
  if (!month) return;
  const orders = loadOrders().filter(o => getMonthKey(o.orderDate || new Date(o.timestamp).toISOString().slice(0,10)) === month);
  if (orders.length === 0) return toast('該月份沒有下單紀錄');

  allItems = getAllItems();
  const summary = {};
  allItems.forEach(item => {
    summary[item.id] = { ...item, depts: Object.fromEntries(DEPTS.map(d => [d, 0])), total: 0 };
  });

  orders.forEach(o => {
    const dept = o.department || '其他';
    o.items.forEach(it => {
      const item = allItems.find(i => i.name === it.name);
      if (item && summary[item.id]) {
        summary[item.id].depts[dept] = (summary[item.id].depts[dept] || 0) + it.qty;
        summary[item.id].total += it.qty;
      }
    });
  });

  let csv = '分類,中文名稱,' + DEPTS.join(',') + ',Sum,單位\n';
  Object.values(summary).forEach(s => {
    if (s.total > 0) {
      const deptVals = DEPTS.map(d => s.depts[d] || 0).join(',');
      csv += `"${s.category}","${s.name}",${deptVals},${s.total},"${s.unit}"\n`;
    }
  });

  const blob = new Blob(['﻿' + csv], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `文具下單總計_${month}.csv`;
  a.click();
  toast(`已匯出 ${month} 月份總計`);
};

document.getElementById('submitBtn').onclick = async () => {

function compressImageDataUrl(file, maxSize = 240, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ev => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let w = img.width;
        let h = img.height;
        if (w > maxSize || h > maxSize) {
          if (w > h) {
            h = Math.round((h * maxSize) / w);
            w = maxSize;
          } else {
            w = Math.round((w * maxSize) / h);
            h = maxSize;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

document.getElementById('newImage').onchange = async e => {
  const file = e.target.files[0];
  const preview = document.getElementById('imagePreview');
  if (file) {
    try {
      const compressed = await compressImageDataUrl(file);
      preview.innerHTML = `<img src="${compressed}" style="max-width:120px;max-height:120px;border-radius:8px">`;
    } catch {
      preview.innerHTML = '';
    }
  } else {
    preview.innerHTML = '';
  }
};

document.getElementById('saveNewItem').onclick = async () => {
  const catSel = document.getElementById('newCat').value;
  const cat = catSel === '__NEW__' ? document.getElementById('newCatCustom').value.trim() : catSel;
  const name = document.getElementById('newName').value.trim();
  const unit = document.getElementById('newUnit').value.trim();
  const link = document.getElementById('newLink').value.trim() || GARRET_CATALOG_URL;
  const imageUrl = document.getElementById('newImageUrl').value.trim();
  const fileInput = document.getElementById('newImage');
  const file = fileInput.files[0];

  if (!cat || !name || !unit) return toast('請填寫分類、名稱、單位');
  if (!file && !imageUrl) return toast('請上傳商品圖片或填寫圖片網址');

  const btn = document.getElementById('saveNewItem');
  btn.disabled = true;
  btn.textContent = '儲存中...';

  try {
    const finalImage = file ? await compressImageDataUrl(file) : imageUrl;
    const newItem = { id: Date.now(), category: cat, name, unit, link, image: finalImage };
    if (isGasConfigured()) {
      await apiPost({ action: 'addCustomItem', item: newItem });
    }

    const custom = loadCustomItems();
    custom.push(newItem);
    saveCustomItems(custom);

    document.getElementById('newCatCustom').value = '';
    document.getElementById('newName').value = '';
    document.getElementById('newUnit').value = '';
    document.getElementById('newLink').value = '';
    document.getElementById('newImageUrl').value = '';
    fileInput.value = '';
    document.getElementById('imagePreview').innerHTML = '';
    document.getElementById('addItemForm').classList.remove('show');
    renderCategories();
    renderItems();
    toast('已新增文具項目');
  } catch (e) {
    setSyncBadge('雲端連線失敗', 'err');
    toast('新增文具失敗，請檢查網路或網址設定');
  } finally {
    btn.disabled = false;
    btn.textContent = '儲存新項目';
  }
};
